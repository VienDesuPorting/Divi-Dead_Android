plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dividead.android'
    compileSdk 35

    defaultConfig {
        applicationId "com.dividead.android"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          '-DANDROID_PLATFORM=android-21'
                cFlags '-D__ANDROID__',
                       '-DHOME_DIRECTORY',
                       '-DGAME_HOME_DIRECTORY',
                       '-DADJUST_FONT_SIZE_DYNAMIC',
                       '-DENABLE_VIDEO_ROQ',
                       '-DSJIS_SUPPORT'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            java.srcDirs = ['src/main/java']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    packagingOptions {
        pickFirst '**/libSDL2.so'
        pickFirst '**/libSDL2_image.so'
        pickFirst '**/libSDL2_mixer.so'
        pickFirst '**/libSDL2_ttf.so'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
