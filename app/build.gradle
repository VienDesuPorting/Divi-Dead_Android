apply plugin: 'com.android.application'

android {
    namespace 'com.dividead.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.dividead.android"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                arguments '-DANDROID_PLATFORM=android-21'
                cFlags '-D__ANDROID__', '-DHOME_DIRECTORY', '-DGAME_HOME_DIRECTORY',
                       '-DADJUST_FONT_SIZE_DYNAMIC', '-DENABLE_VIDEO_ROQ', '-DSJIS_SUPPORT'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            java.srcDirs = ['src/main/java']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    packagingOptions {
        pickFirst '**/libSDL2.so'
        pickFirst '**/libSDL2_image.so'
        pickFirst '**/libSDL2_mixer.so'
        pickFirst '**/libSDL2_ttf.so'
    }
}
