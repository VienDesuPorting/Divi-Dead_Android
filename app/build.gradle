plugins {
    id 'com.android.application'
}

android {
    namespace 'su.viende.dividead'
    compileSdk 35

    defaultConfig {
        applicationId "su.viende.dividead"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            // x86_64 added for Android 16 emulator testing (Nothing Phone 3A
            // crash investigation). Can be removed once the Adreno 800-series
            // render crash is fixed.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          '-DANDROID_PLATFORM=android-24'
                cFlags '-D__ANDROID__',
                       '-DHOME_DIRECTORY',
                       '-DGAME_HOME_DIRECTORY',
                       '-DADJUST_FONT_SIZE_DYNAMIC',
                       '-DENABLE_VIDEO_ROQ',
                       '-DSJIS_SUPPORT'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            java.srcDirs = ['src/main/java']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
            // Keep full debug symbols (unstripped) in the build layout so
            // crash reports / logcat stack traces show function names and
            // line numbers instead of raw addresses. Essential for
            // diagnosing the Adreno 800-series render crash.
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    packagingOptions {
        pickFirst '**/libSDL2.so'
        pickFirst '**/libSDL2_image.so'
        pickFirst '**/libSDL2_mixer.so'
        pickFirst '**/libSDL2_ttf.so'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    lint {
        abortOnError false
        disable 'DeprecatedApi'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Force consistent Kotlin stdlib version to avoid duplicate class errors
    // (kotlin-stdlib 1.8+ merged jdk7/jdk8 modules, but old deps still pull them)
    constraints {
        implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

// Exclude old kotlin-stdlib-jdk7/jdk8 since they're merged into kotlin-stdlib 1.8+
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
